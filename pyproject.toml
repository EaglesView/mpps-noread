[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpps-noread"
description = "Decryptor for the MPPS NOREAD encrypted ECU tune format"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "jim", email = "jbouchardprod@gmail.com" }]
keywords = ["ecu", "tuning", "mpps", "noread", "decrypt", "med9", "bosch"]
dynamic = ["version"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Utilities",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]
build = ["pyinstaller>=6.3,<7"]

[project.urls]
Homepage = "https://github.com/EaglesView/mpps-noread"

[project.scripts]
noread = "noread:main"
noread-gui = "noread_gui:main"

[tool.setuptools]
py-modules = ["noread", "noread_gui"]

[tool.setuptools.dynamic]
version = { attr = "noread.__version__" }
